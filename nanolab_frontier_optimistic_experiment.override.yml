node_config_overrides:
  node:
    priority_scheduler:
      enable: false
    hinted_scheduler:
      enable: false
    optimistic_scheduler:
      enable: false
    frontier_optimistic:
      max_backlog: 65536
      retry_interval: 250
    active_elections:
      enable: true
    bootstrap:
      enable_frontier_scan: true
      enable_topo_scan: true
    diagnostics:
      optimistic_election:
        enable: true

rpc_checks:
  counters:
    action: stats
    type: counters
  samples:
    action: stats
    type: samples

prometheus_checks:
  counters: 'nano_stats_counters{type="optimistic_election"}'
  samples: 'nano_stats_samples_count{sample=~"frontier_.*"}'
